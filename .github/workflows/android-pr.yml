name: Android Pull Request CI

on:
  pull_request:
    branches:
      - '**'

jobs:
  android-ci:
    runs-on: ubuntu-latest

    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3. Create local.properties for Android SDK
      - name: Create local.properties
        run: echo "sdk.dir=/opt/android-sdk" > local.properties

      # 4. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Run Detekt
      - name: Run Detekt
        run: ./gradlew detekt

      # 6. Run Unit Tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 7. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # 8. Set up Node.js (для firebase-tools, если нужно)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 9. Create Firebase service account file
      - name: Create Firebase service account file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-key.json

      # 10. Export credentials for Firebase
      - name: Set GOOGLE_APPLICATION_CREDENTIALS
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase-key.json" >> $GITHUB_ENV

      # 11. Upload APK to Firebase App Distribution
      - name: Upload APK to Firebase App Distribution
        run: ./gradlew :app:appDistributionUploadDebug
