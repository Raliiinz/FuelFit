name: Android Pull Request CI

on:
  pull_request:

jobs:
  android-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create local.properties
        run: |
          echo "sdk.dir=/opt/android-sdk" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/*.kts', '**/gradle-wrapper.properties') }}

      - name: Create Firebase service account file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-key.json

      - name: Export Firebase credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase-key.json" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug
        run: ./gradlew assembleDebug

      - name: Inject Firebase App Distribution config
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          firebaseAppDistributionAppId=${{ secrets.FIREBASE_APP_ID }}
          firebaseAppDistributionTesters=${{ secrets.FIREBASE_TESTERS }}
          firebaseAppDistributionReleaseNotes=PR build from GitHub
          EOF

      - name: Upload to Firebase App Distribution
        run: ./gradlew :app:appDistributionUploadDebug
